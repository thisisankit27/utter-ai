version: 2

# Policy: Dependabot keeps security patches and minor/patch bumps flowing.
# Major upgrades (build tooling, frameworks, the Rust toolchain) are done by
# hand with a migration pass — never on a schedule.

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Pinned on purpose — a new compiler brings new clippy lints and
      # `-D warnings` turns those into build failures.
      - dependency-name: "dtolnay/rust-toolchain"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      tauri-js:
        patterns: ["@tauri-apps/*"]
        update-types: ["minor", "patch"]
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
      prod:
        dependency-type: production
        update-types: ["minor", "patch"]
    ignore:
      # No unattended majors anywhere in the JS tree — Vite, Tailwind,
      # TypeScript, ESLint, React and friends all need a deliberate bump.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      tauri-rust:
        patterns: ["tauri", "tauri-*"]
        update-types: ["minor", "patch"]
      cargo-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Includes 0.x → 0.y for pre-1.0 crates, which are effectively breaking
      # (e.g. sha2 0.10 → 0.11 changed the digest API).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
