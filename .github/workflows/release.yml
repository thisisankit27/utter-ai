name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            bundles: "deb,appimage"
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            bundles: "nsis,msi"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev libasound2-dev \
            cmake clang libclang-dev patchelf file

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.triple }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }

      - run: npm ci

      - name: Fetch ffmpeg / ffprobe sidecars
        shell: bash
        run: bash scripts/fetch-binaries.sh ${{ matrix.triple }}

      - name: Fetch bundled model
        shell: bash
        run: |
          curl -fL --retry 3 -o src-tauri/resources/models/ggml-base-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "UtterAI ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            Private, local audio & video transcription.

            Download the installer for your platform below. Every artifact is
            built by this workflow; checksums are attached.

            See the full changelog in the commit history.
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Attach SHA-256 checksums
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.payload.inputs?.tag || context.ref.replace('refs/tags/', '');
            const rel = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo, tag,
            });
            const crypto = require('crypto');
            let lines = [];
            for (const a of rel.data.assets) {
              if (a.name.endsWith('.sha256') || a.name === 'checksums.txt') continue;
              const res = await github.request(a.url, {
                headers: { accept: 'application/octet-stream' },
              });
              const hash = crypto.createHash('sha256').update(Buffer.from(res.data)).digest('hex');
              lines.push(`${hash}  ${a.name}`);
            }
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.data.id, name: 'checksums.txt', data: lines.join('\n') + '\n',
            });
