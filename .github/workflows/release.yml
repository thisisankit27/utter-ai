name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
            bundles: "deb,appimage"
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            bundles: "nsis,msi"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev libasound2-dev \
            cmake clang libclang-dev patchelf file

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@1.98.0
        with: { targets: "${{ matrix.triple }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ". -> target" }

      - run: npm ci

      - name: Fetch ffmpeg / ffprobe sidecars
        shell: bash
        run: bash scripts/fetch-binaries.sh ${{ matrix.triple }}

      - name: Fetch bundled model
        shell: bash
        run: |
          curl -fL --retry 3 -o src-tauri/resources/models/ggml-base-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: "UtterAI ${{ env.TAG }}"
          releaseBody: |
            **Private, local audio & video transcription.**

            Download the installer for your platform below. Every artifact is
            built by this workflow; `checksums.txt` is attached.

            Full notes: [docs/RELEASE_NOTES.md](https://github.com/thisisankit27/utter-ai/blob/master/docs/RELEASE_NOTES.md)
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

      - name: Checksums
        shell: bash
        run: |
          set -e
          out="checksums-${{ matrix.triple }}.txt"
          : > "$out"
          while IFS= read -r f; do
            ( cd "$(dirname "$f")" && sha256sum "$(basename "$f")" ) >> "$PWD/$out"
          done < <(find . -type f \( -name '*.deb' -o -name '*.AppImage' \
                     -o -name '*-setup.exe' -o -name '*.msi' \) 2>/dev/null)
          echo "--- $out ---"; cat "$out"
          test -s "$out"
          gh release upload "${{ env.TAG }}" "$out" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  combine-checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Merge per-platform checksum files into checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release download "${{ env.TAG }}" -R "${{ github.repository }}" -p 'checksums-*.txt' -D cs
          cat cs/*.txt | sort -k2 > checksums.txt
          cat checksums.txt
          gh release upload "${{ env.TAG }}" checksums.txt -R "${{ github.repository }}" --clobber
