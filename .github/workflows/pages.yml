name: Deploy landing page

on:
  push:
    branches: [master]
    paths: ["site/**", ".github/workflows/pages.yml"]
  # The download-counter refresh commits site/downloads.json with the built-in
  # GITHUB_TOKEN, which by design does not trigger the push event above. Redeploy
  # explicitly when that workflow finishes so the live counter stays current.
  workflow_run:
    workflows: ["Refresh download counter"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
