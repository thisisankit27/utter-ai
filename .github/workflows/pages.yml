name: Deploy landing page

on:
  push:
    branches: [master]
    paths: ["site/**", ".github/workflows/pages.yml"]
  # The refresh job commits site/downloads.json and site/checksums.json with the
  # built-in GITHUB_TOKEN, which by design does not trigger the push event above.
  # Redeploy explicitly when it finishes so the live counter and the checksums on
  # the download page stay current. (This name must match `name:` in
  # downloads.yml — a rename silently stops the trigger firing.)
  workflow_run:
    workflows: ["Refresh download data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
