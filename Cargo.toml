[workspace]
resolver = "2"
members = ["crates/utterai-core", "src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["Ankit Srivastava"]
repository = "https://github.com/thisisankit27/utter-ai"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "process", "io-util", "time"] }

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
strip = true
panic = "unwind"
