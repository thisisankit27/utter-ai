[package]
name = "utterai-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Portable transcription engine for UtterAI: media probing, range extraction, local Whisper inference, chunking and export."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
whisper-rs = { version = "0.16", default-features = false, features = ["tracing_backend"] }
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
futures-util = "0.3"
dirs = "6"
fs4 = "1.1"
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[features]
default = []
# Opt-in GPU backends for future builds; v1 ships CPU-only.
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]
